name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - win32-daemon
          - win64-daemon
          - win32-qt
          - win64-qt

jobs:
  build-win32-daemon:
    name: Windows 32-bit Daemon
    runs-on: ubuntu-20.04
    if: github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'win32-daemon'

    env:
      HOST: i686-w64-mingw32
      NAME: win32-daemon
      MAKEJOBS: -j$(nproc)
      CCACHE_SIZE: 100M
      CCACHE_TEMPDIR: /tmp/.ccache-temp
      CCACHE_COMPRESS: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.ccache
            ${{ github.workspace }}/depends/built
            ${{ github.workspace }}/depends/sdk-sources
          key: ${{ runner.os }}-win32-daemon-${{ hashFiles('depends/packages/*') }}
          restore-keys: |
            ${{ runner.os }}-win32-daemon-

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git ca-certificates ccache \
            g++-mingw-w64-i686 mingw-w64-i686-dev \
            python3 nsis wine-binfmt wine32

      - name: Setup ccache
        run: |
          mkdir -p $CCACHE_DIR
          ccache --max-size=$CCACHE_SIZE

      - name: Build dependencies
        run: |
          make $MAKEJOBS -C depends HOST=$HOST NO_QT=1

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --cache-file=config.cache \
            --disable-dependency-tracking \
            --prefix=${{ github.workspace }}/depends/$HOST \
            --bindir=${{ github.workspace }}/release/bin \
            --libdir=${{ github.workspace }}/release/lib \
            --enable-reduce-exports

      - name: Build
        run: |
          make $MAKEJOBS

      - name: Install
        run: |
          make install

      - name: Create release package
        run: |
          mkdir -p release
          cp ./src/*.exe release/ || true
          cd release
          zip -r bitcore-$NAME.zip ./*.exe
          sha256sum bitcore-$NAME.zip > bitcore-$NAME.zip.sha256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: bitcore-win32-daemon
          path: |
            release/bitcore-win32-daemon.zip
            release/bitcore-win32-daemon.zip.sha256.txt

  build-win64-daemon:
